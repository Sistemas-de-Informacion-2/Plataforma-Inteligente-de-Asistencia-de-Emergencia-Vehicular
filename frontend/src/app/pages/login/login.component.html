<div class="login-container min-h-screen flex items-center justify-center p-0 lg:p-6 bg-surface-dark">
  
  <div class="split-card w-full max-w-[1100px] flex rounded-none lg:rounded-[2.5rem] overflow-hidden">
    
    <!-- Columna Izquierda: Formulario -->
    <div class="form-side w-full lg:w-[45%] flex flex-col justify-center bg-white">
      
      <!-- Logo Mobile (Solo se ve en pantallas pequeñas) -->
      <div class="flex lg:hidden flex-col items-center gap-2 mb-10">
        <div class="w-12 h-12 rounded-xl bg-primary-600 flex items-center justify-center shadow-lg">
          <i class='bx bxs-bolt text-2xl text-white'></i>
        </div>
        <h1 class="text-2xl font-black text-text-main">FIXO<span class="text-primary-500">.</span></h1>
      </div>

      <div class="max-w-sm mx-auto w-full">
        <header class="mb-10">
          <h2 class="text-3xl font-black text-text-main tracking-tight mb-2">Bienvenido</h2>
          <p class="text-sm text-text-muted font-medium">Ingresa tus credenciales para administrar tu taller.</p>
        </header>

        <!-- Formulario -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          
          <div *ngIf="errorMessage" 
               class="error-shake p-4 bg-red-50 rounded-2xl text-xs text-alert font-bold border border-red-100 flex items-center gap-2">
            <i class='bx bx-error-circle text-lg'></i>
            {{ errorMessage }}
          </div>

          <div class="space-y-5">
            <div>
              <label for="email" class="block text-[10px] font-black text-text-muted uppercase tracking-[0.15em] mb-2 ml-1">Email</label>
              <div class="relative group">
                <i class='bx bx-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary-500 transition-colors text-xl'></i>
                <input id="email" type="email" formControlName="email"
                  class="input-field w-full pl-12 pr-4 py-3.5 border border-gray-100 rounded-2xl bg-gray-50/50 text-sm focus:outline-none focus:border-primary-300"
                  placeholder="usuario@gmail.com">
              </div>
            </div>

            <div>
              <label for="password" class="block text-[10px] font-black text-text-muted uppercase tracking-[0.15em] mb-2 ml-1">Contraseña</label>
              <div class="relative group">
                <i class='bx bx-lock-alt absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary-500 transition-colors text-xl'></i>
                <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
                  class="input-field w-full pl-12 pr-12 py-3.5 border border-gray-100 rounded-2xl bg-gray-50/50 text-sm focus:outline-none focus:border-primary-300"
                  placeholder="••••••••">
                
                <button type="button" (click)="togglePasswordVisibility()" 
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary-600">
                  <i class='bx' [ngClass]="showPassword ? 'bx-hide' : 'bx-show'" style="font-size: 1.25rem;"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between">
            <label class="flex items-center group cursor-pointer">
              <input type="checkbox" class="peer hidden">
              <div class="w-5 h-5 border-2 border-gray-100 rounded-md bg-white peer-checked:bg-primary-600 peer-checked:border-primary-600 transition-all flex items-center justify-center">
                <i class='bx bx-check text-white text-xs opacity-0 peer-checked:opacity-100 transition-opacity'></i>
              </div>
              <span class="ml-2 text-xs font-bold text-text-muted group-hover:text-text-main transition-colors">Recordarme</span>
            </label>
            <a href="#" class="text-xs font-bold text-primary-600 hover:underline">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" [disabled]="isLoading"
            class="btn-primary-premium w-full py-4 rounded-2xl bg-primary-600 text-white text-sm font-black shadow-lg shadow-primary-500/30 hover:bg-primary-700 transition-all disabled:opacity-70">
            <span *ngIf="isLoading" class="flex items-center justify-center"><i class='bx bx-loader-alt animate-spin mr-2 text-xl'></i> Verificando...</span>
            <span *ngIf="!isLoading">Entrar al Sistema</span>
          </button>
        </form>

        <footer class="mt-10 pt-8 border-t border-gray-50 text-center">
          <p class="text-xs text-text-muted font-medium">
            ¿No tienes cuenta? 
            <a routerLink="/registro-taller" class="text-primary-600 font-black hover:underline">Registra tu Taller</a>
          </p>
        </footer>
      </div>
    </div>

    <!-- Columna Derecha: Solo Publicidad (Senior Look) -->
    <div class="hero-side flex-1 hidden lg:flex relative bg-surface-dark overflow-hidden">
      <div class="hero-overlay absolute inset-0 bg-gradient-to-b from-transparent to-black/20 z-[1]"></div>
  
      @for (img of adImages; track $index) {
        <img [src]="img" 
          [alt]="'Publicidad ' + $index" 
          class="absolute inset-0 m-auto w-[78%] max-w-lg h-auto object-contain transition-all duration-[1200ms] ease-in-out drop-shadow-2xl rounded-2xl"
          [ngClass]="{
           'opacity-100 z-10 scale-100': $index === currentAdIndex(),
           'opacity-0 z-0 scale-105': $index !== currentAdIndex()
          }"
         loading="eager">
      }

      <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex gap-3 z-20">
        @for (img of adImages; track $index) {
          <div (click)="goToAd($index)"
           class="h-1.5 rounded-full transition-all duration-500 shadow-sm cursor-pointer hover:bg-white/50"
           [ngClass]="$index === currentAdIndex() ? 'w-10 bg-white' : 'w-3 bg-white/30'">
          </div>
        }
      </div>
    </div>

  </div>
</div>
