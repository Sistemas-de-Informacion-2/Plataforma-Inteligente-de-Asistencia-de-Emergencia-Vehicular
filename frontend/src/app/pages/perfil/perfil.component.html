<div class="max-w-5xl mx-auto space-y-6 lg:space-y-8 animate-fade-in pb-12">
  
  <div class="flex justify-between items-end">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-text-main tracking-tight">Perfil de Usuario</h1>
      <p class="text-text-muted mt-1 text-sm md:text-base">Gestiona tu información personal y datos de contacto.</p>
    </div>
  </div>

  <!-- Esqueleto Loading -->
  <div *ngIf="isLoading" class="animate-pulse space-y-8">
    <div class="h-64 bg-gray-200 rounded-2xl"></div>
    <div class="h-64 bg-gray-200 rounded-2xl"></div>
  </div>

  <!-- Contenedor Principal (Edición) -->
  <div *ngIf="!isLoading" class="bg-surface-light border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
    
    <form [formGroup]="perfilForm" (ngSubmit)="onSubmit()" class="flex flex-col">
      
      <div class="p-8 space-y-12">
        
        <!-- Bloque: Datos de la Cuenta (Lectura / Parcial Editable) -->
        <section>
          <h2 class="text-lg font-bold text-gray-800 mb-6 flex items-center border-b border-gray-100 pb-2">
            <svg class="h-5 w-5 mr-2 text-primary-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            Credenciales de Cuenta
          </h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Email (Solo lectura) -->
            <div>
              <label class="block text-sm font-semibold text-text-main mb-1">Correo Electrónico</label>
              <input type="text" formControlName="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed opacity-75">
            </div>
            
            <!-- CI (Solo lectura) -->
            <div>
              <label class="block text-sm font-semibold text-text-main mb-1">Cédula de Identidad (CI)</label>
              <input type="text" formControlName="ci" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed opacity-75">
            </div>
            
            <!-- Fecha de Creacion (Solo lectura) -->
            <div>
              <label class="block text-sm font-semibold text-text-main mb-1">Miembro desde</label>
              <input type="text" formControlName="fecha_creacion" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed opacity-75">
            </div>
          </div>
        </section>

        <!-- Bloque: Datos de Perfil (Editables) -->
        <section>
          <h2 class="text-lg font-bold text-gray-800 mb-6 flex items-center border-b border-gray-100 pb-2">
            <svg class="h-5 w-5 mr-2 text-primary-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            Perfil Personal
          </h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Nombre -->
            <div>
              <label class="block text-sm font-semibold text-text-main mb-1">Primer Nombre</label>
              <input type="text" formControlName="nombre" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all outline-none bg-white">
              <div *ngIf="perfilForm.get('nombre')?.touched && perfilForm.get('nombre')?.invalid" class="text-alert text-xs mt-1">El nombre es requerido.</div>
            </div>

            <!-- Segundo Nombre -->
            <div>
              <label class="block text-sm font-semibold text-text-main mb-1">Segundo Nombre <span class="font-normal text-gray-400 bg-gray-100 rounded px-1 ml-1 text-xs">Opcional</span></label>
              <input type="text" formControlName="segundo_nombre" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all outline-none bg-white">
            </div>

            <!-- Apellido Paterno -->
            <div>
              <label class="block text-sm font-semibold text-text-main mb-1">Apellido Paterno</label>
              <input type="text" formControlName="apellido_paterno" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all outline-none bg-white">
              <div *ngIf="perfilForm.get('apellido_paterno')?.touched && perfilForm.get('apellido_paterno')?.invalid" class="text-alert text-xs mt-1">El apellido paterno es requerido.</div>
            </div>

            <!-- Apellido Materno -->
            <div>
              <label class="block text-sm font-semibold text-text-main mb-1">Apellido Materno <span class="font-normal text-gray-400 bg-gray-100 rounded px-1 ml-1 text-xs">Opcional</span></label>
              <input type="text" formControlName="apellido_materno" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all outline-none bg-white">
            </div>

            <!-- Telefono -->
            <div>
              <label class="block text-sm font-semibold text-text-main mb-1">Teléfono Móvil</label>
              <input type="text" formControlName="telefono" placeholder="Ej: +591 77712345" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all outline-none bg-white">
            </div>

            <!-- Fecha de Nacimiento -->
            <div>
              <label class="block text-sm font-semibold text-text-main mb-1">Fecha de Nacimiento <span class="font-normal text-gray-400 bg-gray-100 rounded px-1 ml-1 text-xs">Opcional</span></label>
              <input type="date" formControlName="fecha_nacimiento" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all outline-none bg-white text-gray-700">
            </div>

            <!-- Foto URL -->
            <div class="md:col-span-2">
              <label class="block text-sm font-semibold text-text-main mb-1">Foto de Perfil (URL) <span class="font-normal text-gray-400 bg-gray-100 rounded px-1 ml-1 text-xs">Opcional</span></label>
              <div class="flex gap-4 items-center">
                <input type="url" formControlName="foto_perfil" placeholder="https://ejemplo.com/mifoto.jpg" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all outline-none bg-white">
                <div class="w-12 h-12 rounded-full bg-gray-200 border-2 border-gray-300 flex-shrink-0 overflow-hidden flex items-center justify-center">
                  <img *ngIf="perfilForm.get('foto_perfil')?.value" [src]="perfilForm.get('foto_perfil')?.value" alt="Preview" class="w-full h-full object-cover" onerror="this.style.display='none'">
                  <span *ngIf="!perfilForm.get('foto_perfil')?.value" class="text-gray-400 font-bold text-lg">?</span>
                </div>
              </div>
            </div>
          </div>
        </section>

      </div>

      <!-- Action Footer -->
      <div class="bg-gray-50 border-t border-gray-200 p-6 px-8 flex justify-end items-center">
        <button 
          type="submit" 
          [disabled]="isSaving"
          class="px-8 py-2.5 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-xl shadow-md transition-all transform hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-primary-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center">
          <svg *ngIf="isSaving" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ isSaving ? 'Guardando...' : 'Guardar Cambios' }}
        </button>
      </div>
    </form>

  </div>
</div>

<!-- Toast Notifications -->
<div *ngIf="toastMessage" class="fixed bottom-6 right-6 z-50 animate-fade-in group">
  <div [ngClass]="{
    'bg-success border-success text-white': toastMessage.type === 'success',
    'bg-alert border-alert text-white': toastMessage.type === 'error'
  }" class="px-6 py-4 rounded-xl shadow-2xl border flex items-center mt-2 max-w-sm">
    <svg *ngIf="toastMessage.type === 'success'" class="w-6 h-6 mr-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
    <svg *ngIf="toastMessage.type === 'error'" class="w-6 h-6 mr-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    <p class="font-medium text-sm">{{ toastMessage.text }}</p>
  </div>
</div>
