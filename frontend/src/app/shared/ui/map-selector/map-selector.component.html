<!-- src/app/shared/ui/map-selector/map-selector.component.html -->
<div class="relative w-full h-[400px] md:h-[450px] rounded-xl shadow-sm border border-gray-200 overflow-hidden shrink-0 group">
  
  <div #mapElement class="map-container absolute inset-0"></div>

  <!-- Barra de búsqueda flotante -->
  <div *ngIf="!readonly" class="absolute top-4 left-4 z-[1000] w-[calc(100%-80px)] md:w-96">
    <div class="bg-white rounded-lg shadow-md flex items-center p-1.5 border border-gray-200">
      <input 
        type="text" 
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
        (keyup.enter)="buscarDireccion()"
        placeholder="Buscar dirección (ej. Equipetrol, Santa Cruz)" 
        class="w-full px-3 py-1.5 outline-none text-sm text-gray-700 bg-transparent"
        [disabled]="isSearching()"
      >
      <button 
        type="button"
        (click)="buscarDireccion()" 
        class="p-2 text-gray-500 hover:text-primary-600 hover:bg-gray-100 rounded-md transition-colors"
        [disabled]="isSearching()"
      >
        <svg *ngIf="!isSearching()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <svg *ngIf="isSearching()" class="w-5 h-5 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      </button>
    </div>
  </div>

  <!-- Controles ocultos si readonly es true -->
  <div *ngIf="!readonly" class="absolute bottom-4 right-4 z-20 flex flex-col gap-2">
    <!-- Mi Ubicación -->
    <button 
      type="button"
      (click)="locateMe()" 
      class="bg-white text-primary-600 border border-gray-200 hover:bg-primary-50 p-3 rounded-full shadow-md transition-colors focus:outline-none focus:ring-2 focus:ring-primary-500 hover:scale-105 transform cursor-pointer"
      title="Ir a mi ubicación actual">
       <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
    </button>

    <!-- Eliminar Pin -->
    <button 
      type="button"
      (click)="removeMarker()" 
      class="bg-white text-alert border border-gray-200 hover:bg-red-50 p-3 rounded-full shadow-md transition-colors focus:outline-none focus:ring-2 focus:ring-alert hover:scale-105 transform cursor-pointer"
      title="Eliminar Pin">
       <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
    </button>
  </div>
  
  <!-- Ayuda flotante oculta si readonly es true -->
  <div *ngIf="!readonly" class="absolute top-4 left-4 z-20 pointer-events-none opacity-80 group-hover:opacity-100 transition-opacity">
    <span class="bg-surface-dark bg-opacity-90 backdrop-blur text-text-main px-3 py-1.5 text-xs font-semibold rounded-md shadow-sm border border-gray-200">
      Haz clic en el mapa para ubicar la sucursal
    </span>
  </div>

</div>
